<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js Form Constraints</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <form novalidate>

            <p>
                <label for="email">Email</label>
                <input type="email" id="email" minlength="8" required>
                <span class="error-mail" aria-live="polite"></span>
            </p>
            
            <p>
                <label for="password">Password</label>
                <input type="password" id="password" minlength="8" required>
                <span class="error-password" aria-live="polite"></span>
            </p>
            
            <p>
                <label for="password-confirmation">Password confirmation</label>
                <input type="password" id="password-confirmation" required>
                <span class="error-password-confirmation" aria-live="polite"></span>
            </p>
            <button class="submit-button">Submit</button>
        </form>
    </main>
    <script src="index.js" defer></script>
</body>
</html>
